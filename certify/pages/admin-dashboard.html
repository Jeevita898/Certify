<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Certify</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div id="navbar"></div>

<div class="dash-wrap">

<!-- Sidebar -->
<aside class="sidebar">

<div class="sidebar-profile">

<div class="avatar avatar-lg avatar-admin">
A
</div>

<div class="sidebar-name">
System Admin
</div>

<span class="badge badge-rejected mt-2">
Admin
</span>

</div>

<nav class="sidebar-nav" id="sidebarNav"></nav>

</aside>

<!-- Main -->
<main class="fade-up">

<div class="page-hdr">
<h2>Admin Overview</h2>
<p>System-wide management and monitoring</p>
</div>

<!-- Stats -->
<div class="stats-row">

<div class="stat-card">
<div class="stat-label">Total Students</div>
<div class="stat-value" id="stStudents">—</div>
</div>

<div class="stat-card">
<div class="stat-label">Faculty Proctors</div>
<div class="stat-value" id="stFaculty">—</div>
</div>

<div class="stat-card">
<div class="stat-label">Certificates</div>
<div class="stat-value" id="stCerts">—</div>
</div>

<div class="stat-card">
<div class="stat-label">Events</div>
<div class="stat-value" id="stEvents">—</div>
</div>

</div>

<!-- Actions -->
<div class="flex gap-3 mb-6">

<a href="admin-events.html"
class="btn btn-primary">
📅 Manage Events
</a>

<a href="admin-faculty.html"
class="btn btn-outline">
👨‍🏫 Faculty
</a>

<button class="btn btn-success"
onclick="showTopStudents()">
🏆 Top Students
</button>

</div>

<!-- Analytics Dashboard -->
<div class="section-title">
System Analytics
</div>
<div id="chartsWrap" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
  <div class="card" style="padding: 1.5rem;">
    <h3 style="margin-top:0; margin-bottom: 1rem; font-size: 1.1rem;">Approval Trends</h3>
    <canvas id="approvalChart"></canvas>
  </div>
  <div class="card" style="padding: 1.5rem;">
    <h3 style="margin-top:0; margin-bottom: 1rem; font-size: 1.1rem;">Top Categories</h3>
    <canvas id="categoryChart"></canvas>
  </div>
</div>

<!-- Students -->
<div class="section-title">
All Students
</div>

<div id="studentsWrap">

<div class="empty">
<div class="empty-icon">⏳</div>
<h3>Loading...</h3>
</div>

</div>

</main>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>

<script>

const user = requireAuth('admin');

if(user) init();

async function init(){

renderNavbar('admin','Admin');

document.getElementById('sidebarNav').innerHTML =
buildSidebar([
{ href:'admin-dashboard.html', icon:'📊', label:'Overview' },
{ href:'admin-events.html', icon:'📅', label:'Manage Events' },
{ href:'admin-faculty.html', icon:'👨‍🏫', label:'Faculty' }
]);

try{

const [statsRes, stuRes] =
await Promise.all([
getAdminStats(),
getAllStudents()
]);

const s = statsRes.stats;

document.getElementById('stStudents').textContent =
s.students;

document.getElementById('stFaculty').textContent =
s.faculty;

document.getElementById('stCerts').textContent =
s.activities;

document.getElementById('stEvents').textContent =
s.events;

renderStudents(stuRes.students || []);

// Fetch activities for charts
const token = getToken();
const activitiesRes = await fetch('https://certify-eix1.onrender.com/api/activities/all', {
  headers: { Authorization: `Bearer ${token}` }
});
const activitiesData = await activitiesRes.json();

if (activitiesData.success && activitiesData.activities) {
  renderCharts(activitiesData.activities);
}

}catch(err){

showToast('Error: ' + err.message);

}

}

function renderCharts(activities) {
  // 1. Approval Trends (Pie Chart)
  let approved = 0;
  let rejected = 0;
  let pending = 0;
  
  // 2. Top Categories (Bar Chart)
  const categoryCounts = {};
  
  activities.forEach(act => {
    if (act.status === 'approved') approved++;
    else if (act.status === 'rejected') rejected++;
    else pending++;
    
    categoryCounts[act.type] = (categoryCounts[act.type] || 0) + 1;
  });
  
  const ctxApproval = document.getElementById('approvalChart').getContext('2d');
  new Chart(ctxApproval, {
    type: 'doughnut',
    data: {
      labels: ['Approved', 'Rejected', 'Pending'],
      datasets: [{
        data: [approved, rejected, pending],
        backgroundColor: ['#22c55e', '#ef4444', '#f59e0b'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom' }
      }
    }
  });
  
  // Sort categories by count
  const sortedCategories = Object.entries(categoryCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5); // top 5
    
  const ctxCategory = document.getElementById('categoryChart').getContext('2d');
  new Chart(ctxCategory, {
    type: 'bar',
    data: {
      labels: sortedCategories.map(c => c[0].split('/')[0].trim()), // short label
      datasets: [{
        label: 'Uploads',
        data: sortedCategories.map(c => c[1]),
        backgroundColor: '#6366f1',
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1 } }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}

function renderStudents(students){

const wrap =
document.getElementById('studentsWrap');

if(!students.length){

wrap.innerHTML =
`
<div class="empty">
<div class="empty-icon">🎓</div>
<h3>No students registered</h3>
</div>
`;

return;

}

wrap.innerHTML =
`
<div class="table-wrap">

<table>

<thead>

<tr>
<th>Student</th>
<th>USN</th>
<th>Department</th>
<th>Faculty</th>
<th>Total Points</th>
</tr>

</thead>

<tbody>

${students.map(s => `

<tr>

<td>
<div style="font-weight:500">
${s.firstName} ${s.lastName}
</div>

<div class="text-muted text-sm">
${s.email}
</div>
</td>

<td>${s.usn}</td>

<td>${s.department}</td>

<td>
${s.facultyId ? s.facultyId.name : '—'}
</td>

<td style="font-weight:600;color:var(--accent)">
${s.totalPoints || 0}
</td>

</tr>

`).join('')}

</tbody>

</table>

</div>
`;

}

async function showTopStudents(){

try{

const res =
await getAllStudents();

const students =
(res.students || [])
.sort((a,b)=>
(b.totalPoints||0) -
(a.totalPoints||0)
)
.slice(0,5);

showToast(
'Top Student: ' +
students[0].firstName +
' (' +
students[0].totalPoints +
' pts)'
);

}catch(err){

showToast(err.message);

}

}

</script>

</body>
</html>
