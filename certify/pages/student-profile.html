<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Certify</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="dash-wrap">
  <aside class="sidebar">
    <div class="sidebar-profile">
      <div class="avatar avatar-lg" id="sideAvatar"></div>
      <div class="sidebar-name" id="sideName"></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <main class="fade-up">
    <div class="page-hdr"><h2>My profile</h2><p>View and update your personal information</p></div>
    <div class="card mb-4">
      <div class="flex items-center gap-4" style="margin-bottom:1.5rem">
        <div class="avatar avatar-lg" id="profileAvatar"></div>
        <div>
          <div style="font-family:'Instrument Serif',serif;font-size:1.5rem" id="profileName"></div>
          <div class="text-muted text-sm mt-1" id="profileEmail"></div>
          <span class="badge badge-accent mt-2">Student</span>
        </div>
      </div>
      <div class="profile-grid" id="profileGrid"></div>
    </div>
    <div class="card mb-4">
      <div class="section-title">👨‍🏫 Assigned faculty proctor</div>
      <div id="proctorInfo"><p class="text-muted">Loading...</p></div>
    </div>
    <div class="card">
      <div class="section-title">Edit profile</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">First name</label><input type="text" id="editFirst" class="form-control"></div>
        <div class="form-group"><label class="form-label">Last name</label><input type="text" id="editLast" class="form-control"></div>
      </div>
      <div class="form-group"><label class="form-label">Email address</label><input type="email" id="editEmail" class="form-control"></div>
      <div class="form-group">
        <label class="form-label">USN / Roll number</label>
        <input type="text" id="editUSN" class="form-control" readonly style="opacity:.6;cursor:not-allowed">
        <div class="form-hint">USN cannot be changed. Contact admin if there's an error.</div>
      </div>
      <div id="editError"   class="form-error hidden"></div>
      <div id="editSuccess" class="alert alert-success hidden mt-2"></div>
      <button class="btn btn-primary mt-3" id="saveBtn" onclick="saveProfile()">Save changes</button>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script>
  const user = requireAuth('student');
  if (user) init();

  function init() {
    renderNavbar('student', user.firstName+' '+user.lastName);
    document.getElementById('sideAvatar').textContent = initials(user.firstName+' '+user.lastName);
    document.getElementById('sideName').textContent   = user.firstName+' '+user.lastName;
    document.getElementById('sidebarNav').innerHTML   = buildSidebar([
      { href:'student-dashboard.html', icon:'📊', label:'Dashboard' },
      { href:'add-activity.html',      icon:'➕', label:'Add activity' },
      { href:'events.html',            icon:'📅', label:'Events' },
      { href:'notifications.html',     icon:'🔔', label:'Notifications' },
      { divider:true },
      { href:'student-profile.html',   icon:'👤', label:'My profile' },
    ]);
    loadProfile();
  }

  async function loadProfile() {
    try {
      const { student } = await getStudentProfile();
      const av = initials(student.firstName+' '+student.lastName);
      document.getElementById('profileAvatar').textContent = av;
      document.getElementById('profileName').textContent   = student.firstName+' '+student.lastName;
      document.getElementById('profileEmail').textContent  = student.email;
      document.getElementById('profileGrid').innerHTML = `
        <div class="profile-field"><div class="field-label">USN</div><div class="field-value">${student.usn}</div></div>
        <div class="profile-field"><div class="field-label">Department</div><div class="field-value">${student.department}</div></div>
        <div class="profile-field"><div class="field-label">Role</div><div class="field-value">Student</div></div>
        <div class="profile-field"><div class="field-label">Member since</div><div class="field-value">${formatDate(student.createdAt)}</div></div>`;

      const f = student.facultyId;
      document.getElementById('proctorInfo').innerHTML = f ? `
        <div class="flex items-center gap-3" style="padding:8px 0">
          <div class="avatar avatar-faculty">${initials(f.name)}</div>
          <div>
            <div style="font-weight:600;font-size:15px">${f.name}</div>
            <div class="text-muted text-sm">${f.department}</div>
            <div class="text-muted text-sm">${f.email}</div>
            <div class="text-muted text-sm">Emp ID: ${f.empId}</div>
          </div>
        </div>` : '<p class="text-muted">No proctor assigned.</p>';

      document.getElementById('editFirst').value = student.firstName;
      document.getElementById('editLast').value  = student.lastName;
      document.getElementById('editEmail').value = student.email;
      document.getElementById('editUSN').value   = student.usn;
    } catch(err) { showToast('Error: '+err.message); }
  }

  async function saveProfile() {
    const firstName = document.getElementById('editFirst').value.trim();
    const lastName  = document.getElementById('editLast').value.trim();
    const email     = document.getElementById('editEmail').value.trim();
    clearError('editError');
    document.getElementById('editSuccess').classList.add('hidden');
    if (!firstName||!lastName||!email) { setError('editError','Name and email cannot be empty.'); return; }
    setLoading('saveBtn', true);
    try {
      await updateStudentProfile({ firstName, lastName, email });
      // Update session
      const s = getSession();
      s.firstName = firstName; s.lastName = lastName; s.email = email;
      saveSession(s, getToken());
      document.getElementById('editSuccess').textContent = '✅ Profile updated.';
      document.getElementById('editSuccess').classList.remove('hidden');
      showToast('Profile saved!');
      loadProfile();
    } catch(err) { setError('editError', err.message); }
    finally { setLoading('saveBtn', false); }
  }
</script>
</body>
</html>
